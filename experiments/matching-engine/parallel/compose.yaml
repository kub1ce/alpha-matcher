name: alpha-matcher-parallel-cpu
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    cpuset: "0,1"
    mem_limit: 1g
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--performance-schema=ON", "--innodb-buffer-pool-size=134217728"]
    environment:
      MYSQL_DATABASE: matching_engine_exp
      MYSQL_USER: matcher
      MYSQL_PASSWORD: ${MATCHING_DB_PASSWORD:?Use Run-ParallelTests.ps1}
      MYSQL_ROOT_PASSWORD: ${MATCHING_PROFILE_ROOT_PASSWORD:?Use Run-ParallelTests.ps1}
    ports: ["127.0.0.1:33079:3306"]
    tmpfs: ["/var/lib/mysql:size=1073741824"]
    volumes:
      - ../sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../src/test/resources/fixtures.sql:/docker-entrypoint-initdb.d/002_fixtures.sql:ro
      - ../performance/profile-grants.sql:/docker-entrypoint-initdb.d/003_profile.sql:ro
      - ./capture-cgroup.sh:/capture-cgroup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin --protocol=TCP -h 127.0.0.1 -u matcher ping --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  app:
    image: eclipse-temurin:25-jdk@sha256:3ab7fc8d0b4ade8fef96903fb36767c1dbb4fd1535dcfad85b59c17afbbb5857
    cpuset: "0,1"
    mem_limit: 1g
    network_mode: "service:mysql"
    depends_on:
      mysql: {condition: service_healthy}
    working_dir: /work
    environment:
      MATCHING_DB_USER: matcher
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:?Use Run-ParallelTests.ps1}
      MATCHING_DB_URL: jdbc:mysql://127.0.0.1:3306/matching_engine_exp?characterEncoding=UTF-8&connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=15000&allowPublicKeyRetrieval=true&sslMode=DISABLED
    volumes:
      - ../:/work:ro
      - ${MATCHING_PARALLEL_OUTPUT:?Use Run-ParallelTests.ps1}:/results
    command: ["java", "-Xms128m", "-Xmx768m", "-cp", "/work/target/classes:/work/target/dependency/*", "ru.urfu.alphamatcher.experiment.ParallelBenchmarkMain"]
