spring.application.name=alpha-matcher

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alpha_matcher_dev}
spring.datasource.username=${DB_USERNAME:alpha_matcher_dev}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080